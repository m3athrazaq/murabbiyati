# Runs the Android app in an emulator, drives it with native/selftest/selftest.js and
# native/selftest/android-smoke.sh, and publishes screenshots + results to the
# "ci-android-smoke" pre-release.
name: Android emulator smoke test

on:
  workflow_dispatch:
  push:
    branches: [iphone-app]
    paths:
      - 'index.html'
      - 'native/**'
      - '.github/workflows/android-smoke.yml'

permissions:
  contents: write

concurrency:
  group: android-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: App files + self-test hook (test build only)
        run: |
          rm -rf native/www && mkdir -p native/www
          cp index.html manifest.webmanifest *.png native/www/
          cp native/selftest/selftest.js native/www/selftest.js
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("native/www/index.html")
          s = p.read_text(encoding="utf-8")
          p.write_text(s.replace("</body>", '<script src="selftest.js"></script>\n</body>'), encoding="utf-8")
          PY

      - name: Install + sync
        working-directory: native
        run: |
          npm ci
          npx cap sync android

      - name: Build the test APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          ls -la app/build/outputs/apk/debug/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in the emulator (Android 15)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash native/selftest/android-smoke.sh

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find smoke -type f -empty -delete 2>/dev/null || true   # GitHub refuses empty release files
          ls -la smoke || true
          gh release delete ci-android-smoke --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create ci-android-smoke smoke/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --prerelease --latest=false --title "CI Android smoke test" --notes "Automated emulator run for ${{ github.sha }}"
